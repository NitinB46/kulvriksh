# Render blueprint: one free web service that serves the API and the Angular site.
# Note: the free plan's disk is temporary. Admin edits made on the live site are lost
# when the service restarts or redeploys; use "Download backup" to keep them.
services:
  - type: web
    name: kulvriksh
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production npm --prefix server start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE
        value: local
